[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "act-ecosystem"
version = "2.1"
description = "ACT: Accelerator Compiler Toolkit"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "ACT Compiler Team"},
]
readme = "README.md"
dependencies = [
    "taidl @ git+https://github.com/act-compiler/taidl.git@v2.13",
    "taidl-to @ git+https://github.com/act-compiler/act-oracle.git@v2.7",
    "act-backend @ git+https://github.com/act-compiler/act-backend.git@v1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["act*"]

[tool.ruff]
line-length = 100
# Python files alone, not markdown code blocks
include = ["*.py"]
# The tutorials, kept as they are written
extend-exclude = ["tutorials"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
