name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the ecosystem image
        run: ./docker/build.sh --cpu

      - name: Check the pinned versions
        run: ./docker/exec.sh "python tests/check_versions.py"

      - name: Run the end-to-end test
        run: ./tests/pytest.sh
